<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - LumiFrame Studio</title>
  <meta name="description"
    content="Register for LumiFrame Studio Members Circle to access express booking and private gallery downloads.">
  <link rel="icon" type="image/png" href="assets/images/common/lumi_icon.png">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Modular Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/typography.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/light-theme.css">
  <link rel="stylesheet" href="assets/css/dark-theme.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/desktop.css">
  <link rel="stylesheet" href="assets/css/laptop.css">
  <link rel="stylesheet" href="assets/css/tablet.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive-patch.css">
</head>

<body>

  <!-- Full-Bleed Authentication Layout -->
  <div class="auth-wrapper" style="background-image: url('assets/images/auth/signup-bg.png');">
    <div class="auth-overlay"></div>

    <!-- Top-Right Controls -->
    <div class="auth-top-controls">
      <button type="button" class="icon-toggle-btn theme-toggle-btn" title="Toggle Theme"><i
          class="bi bi-moon-stars-fill"></i></button>
      <button type="button" class="icon-toggle-btn rtl-toggle-btn" title="Toggle RTL/LTR"><span class="rtl-label"
          style="font-size:0.75rem; font-weight:700;">RTL</span></button>
    </div>

    <!-- Main Auth Container -->
    <div class="auth-card-container">

      <!-- Centered Branding Above Form -->
      <div class="auth-branding">
        <a href="index.html" class="d-inline-flex align-items-center gap-3 text-decoration-none">
          <img src="assets/images/common/lumi_logo.svg" alt="LumiFrame Studio Logo">
          <span class="font-heading fw-bold text-white fs-3">LumiFrame Studio</span>
        </a>
      </div>

      <!-- Glassmorphism Card -->
      <div class="auth-card">
        <h1 class="auth-title">Join Members Circle</h1>
        <p class="auth-subtitle">Create an account for express booking &amp; gallery access.</p>

        <form id="signupForm" class="needs-validation" novalidate>
          <div class="form-group mb-3">
            <label for="signupName" class="form-label-custom">Full Name</label>
            <input type="text" class="form-control-custom" id="signupName" placeholder="e.g. Julian Vance" required>
            <div class="invalid-feedback-custom">Please enter your name.</div>
          </div>

          <div class="form-group mb-3">
            <label for="signupEmail" class="form-label-custom">Email Address</label>
            <input type="email" class="form-control-custom" id="signupEmail" placeholder="julian@example.com" required>
            <div class="invalid-feedback-custom">Please enter your email.</div>
          </div>

          <div class="form-group mb-3">
            <label for="signupPassword" class="form-label-custom">Password</label>
            <input type="password" class="form-control-custom" id="signupPassword" placeholder="Minimum 8 characters" required>
            <div class="invalid-feedback-custom">Please choose a password.</div>
          </div>

          <div class="form-group mb-3">
            <label for="confirmPassword" class="form-label-custom">Confirm Password</label>
            <input type="password" class="form-control-custom" id="confirmPassword" placeholder="Re-enter password" required>
            <div class="invalid-feedback-custom">Passwords do not match.</div>
          </div>

          <div class="form-check-custom mb-4">
            <input type="checkbox" class="form-check-input-custom" id="agreeTerms" required>
            <label for="agreeTerms" class="form-check-label-custom">I agree to the <a href="#" class="text-gold">Terms
                of Service</a> &amp; <a href="#" class="text-gold">Privacy Policy</a></label>
          </div>

          <button type="submit" class="btn btn-primary-gold w-100 py-3 mb-3">Create Client Account</button>
        </form>

        <div class="auth-footer-links">
          <span>Already have an account?</span> <a href="login.html">Log In</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/booking.js"></script>
</body>

</html>
