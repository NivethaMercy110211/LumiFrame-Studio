<!DOCTYPE html>
<html lang="en" data-theme="dark" data-bs-theme="dark" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Login - LumiFrame Studio</title>
  <meta name="description"
    content="Access your private client portal, proofing gallery, and session downloads at LumiFrame Studio.">
  <link rel="icon" type="image/svg+xml" href="assets/images/common/lumi_logo.svg">
  <link rel="alternate icon" type="image/png" href="assets/images/common/lumi_icon.png">
  <link rel="apple-touch-icon" href="assets/images/common/lumi_logo.svg">

  <!-- Bootstrap 5 & Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Modular Custom Stylesheets -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/typography.css">
  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="assets/css/cards.css">
  <link rel="stylesheet" href="assets/css/buttons.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/light-theme.css">
  <link rel="stylesheet" href="assets/css/dark-theme.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="stylesheet" href="assets/css/desktop.css">
  <link rel="stylesheet" href="assets/css/laptop.css">
  <link rel="stylesheet" href="assets/css/tablet.css">
  <link rel="stylesheet" href="assets/css/mobile.css">
  <link rel="stylesheet" href="assets/css/responsive-patch.css">
</head>

<body>

  <!-- Full-Bleed Authentication Layout -->
  <div class="auth-wrapper" style="background-image: url('assets/images/auth/login-bg.png');">
    <div class="auth-overlay"></div>

    <!-- Top-Right Theme and RTL Controls -->
    <div class="auth-top-controls">
      <button type="button" class="icon-toggle-btn theme-toggle-btn" title="Toggle Theme" id="authThemeToggle"><i
          class="bi bi-moon-stars-fill"></i></button>
      <button type="button" class="icon-toggle-btn rtl-toggle-btn" title="Toggle RTL/LTR" id="authRtlToggle"><span
          class="rtl-label" style="font-size:0.75rem; font-weight:700;">RTL</span></button>
    </div>

    <!-- Main Auth Container -->
    <div class="auth-card-container">

      <!-- Centered Branding Above Form -->
      <div class="auth-branding">
        <a href="index.html" id="authLogoLink" class="d-inline-flex align-items-center gap-3 text-decoration-none">
          <img src="assets/images/common/lumi_logo.svg" alt="LumiFrame Studio Logo">
          <span class="font-heading fw-bold text-white fs-3">LumiFrame Studio</span>
        </a>
      </div>

      <!-- Glassmorphism Card -->
      <div class="auth-card">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your private portrait gallery &amp; downloads.</p>

        <form id="loginForm" class="needs-validation" novalidate>
          <div class="form-group mb-3">
            <label for="loginEmail" class="form-label-custom">Email Address</label>
            <input type="email" class="form-control-custom" id="loginEmail" placeholder="client@example.com" required>
            <div class="invalid-feedback-custom">Please enter your email.</div>
          </div>

          <div class="form-group mb-3">
            <label for="loginPassword" class="form-label-custom">Password</label>
            <input type="password" class="form-control-custom" id="loginPassword" placeholder="••••••••" required>
            <div class="invalid-feedback-custom">Please enter your password.</div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div class="form-check-custom mb-0">
              <input type="checkbox" class="form-check-input-custom" id="rememberMe">
              <label for="rememberMe" class="form-check-label-custom mb-0">Remember me</label>
            </div>
            <a href="forgot-password.html" class="text-gold text-decoration-none small">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary-gold w-100 py-3 mb-3">Log In To Portal</button>
        </form>

        <div class="auth-footer-links">
          <span>Don't have a gallery account?</span> <a href="signup.html">Sign Up</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/booking.js"></script>
</body>

</html>
