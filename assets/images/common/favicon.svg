<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D696"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#947437"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5DE"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Outer Fine-Art Frame Hexagon Ring -->
  <polygon points="100,12 176,56 176,144 100,188 24,144 24,56" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="100,24 166,62 166,138 100,176 34,138 34,62" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.6"/>

  <!-- Camera Lens Shutter Aperture Blades -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round">
    <path d="M 100 48 L 138 100 L 100 152 L 62 100 Z"/>
    <circle cx="100" cy="100" r="32" stroke="url(#goldGlow)" stroke-width="4"/>
    <circle cx="100" cy="100" r="18" fill="url(#goldGrad)"/>
    <circle cx="93" cy="93" r="5" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Four Gold Corner Accent Stars -->
  <path d="M 100 28 L 102 34 L 108 36 L 102 38 L 100 44 L 98 38 L 92 36 L 98 34 Z" fill="url(#goldGlow)"/>
  <path d="M 100 156 L 102 162 L 108 164 L 102 166 L 100 172 L 98 166 L 92 164 L 98 162 Z" fill="url(#goldGlow)"/>
</svg>
